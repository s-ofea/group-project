#Tidying Data
--

``` r
#Selecting necessary columns from the dataset
hd_mortalitybyca &lt;- hd_mortalitybyca [, c("Year", "AgeGroup", "Sex", "Diagnosis", "NumberOfDeaths", "CrudeRate", "Ca")]
```
--

``` r
#Filtering and tidying the specific data
hd_mortality_year &lt;- hd_mortalitybyca %&gt;% 
  filter(
  Year != "2024p", 
  Ca == "S92000003",
  Diagnosis == "Coronary Heart Disease",
  AgeGroup %in% c("75plus years"),
  Sex != "All") %&gt;%
    mutate(Year = as.numeric(Year)) %&gt;%
  arrange(Sex)
```

# Code

``` r
mortality_female_fit &lt;- linear_reg() %&gt;%
  set_engine("lm") %&gt;%
  fit(CrudeRate ~ Year, 
      data = hd_mortality_year %&gt;% filter(Sex == "Female")) 

mortality_male_fit &lt;- linear_reg() %&gt;%
  set_engine("lm") %&gt;%
  fit(CrudeRate ~ Year, 
      data = hd_mortality_year %&gt;% filter(Sex == "Male")) 
```
---

``` r
mortality_male_fit
```

---

``` r
mortality_female_aug &lt;- augment(mortality_female_fit$fit) %&gt;%
                                mutate(Sex = "Female")

mortality_male_aug &lt;- augment(mortality_male_fit$fit) %&gt;%
                                mutate(Sex = "Male")

mortality_year_fit_aug &lt;- bind_rows(
  mortality_female_aug,
  mortality_male_aug
) %&gt;%
  mutate(residual = ifelse(.resid &gt;0, TRUE, FALSE))
```

# Math Expressions

You can write LaTeX math expressions inside a pair of dollar signs, e.g. &amp;#36;\alpha+\beta$ renders `\(\alpha+\beta\)`. You can use the display style with double dollar signs:

```
$$\bar{X}=\frac{1}{n}\sum_{i=1}^nX_i$$
```

`$$\bar{X}=\frac{1}{n}\sum_{i=1}^nX_i$$`

Limitations:

1. The source code of a LaTeX math expression must be in one line, unless it is inside a pair of double dollar signs, in which case the starting `$$` must appear in the very beginning of a line, followed immediately by a non-space character, and the ending `$$` must be at the end of a line, led by a non-space character;

1. There should not be spaces after the opening `$` or before the closing `$`.
